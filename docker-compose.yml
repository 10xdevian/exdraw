version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: exdraw
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: exdraw 
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: exdraw-redis
    restart: always
    ports:
      - "6379:6379"

  ws-backend:
    build:
      context: .
      dockerfile: apps/ws-backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://admin:secret@postgres:5432/exdraw
      - REDIS_URL=redis://redis:6379
    ports:
      - "8080-8089:8080"
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 2

volumes:
  pgdata:
